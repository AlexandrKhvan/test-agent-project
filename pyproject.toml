[project]
name = "hackalem-edu-agent"
version = "0.1.0"
description = "Autonomous Socratic Multi-Agent Educational Pipeline for HackAlem AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "google-genai>=0.1.1",
    "pydantic>=2.7.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.1.0",
    "crewai>=0.51.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "streamlit>=1.36.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "pypdf>=4.2.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "markdown>=3.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false