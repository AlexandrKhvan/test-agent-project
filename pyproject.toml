[project]
name = "hackalem-edu-agent"
version = "0.1.0"
description = "Autonomous Socratic AI Tutor with Agentic Loop for HackAlem AI 2026"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "pydantic>=2.7.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.1.0",
    "crewai>=0.51.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "streamlit>=1.36.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "pypdf>=4.2.0",
    "pdfplumber>=0.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false
